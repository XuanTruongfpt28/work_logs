<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a8a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1e3a8a">
    AI AWS Advisor - Reference Architecture (CloudFront, Cognito, Edge Layer)
  </text>

  <!-- Edge Layer -->
  <rect x="80" y="80" width="360" height="100" rx="12" fill="#1e40af" stroke="#1e3a8a" stroke-width="2"/>
  <text x="260" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Edge Layer</text>
  <text x="260" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Amazon CloudFront</text>
<text x="260" y="146" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Route 53</text>
  <!-- Frontend -->
  <rect x="80" y="220" width="360" height="100" rx="12" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
  <text x="260" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Frontend</text>
  <text x="260" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">React 18 + Vite + Tailwind</text>
<text x="260" y="286" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Recharts, TanStack Query</text>
  <line x1="260" y1="180" x2="260" y2="212" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- API Gateway -->
  <rect x="560" y="150" width="380" height="100" rx="12" fill="#0e7490" stroke="#0c4a6e" stroke-width="2"/>
  <text x="750" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Amazon API Gateway</text>
  <text x="750" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">REST API + Rate Limiting</text>
<text x="750" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">API Key Authentication</text>
  <line x1="440" y1="270" x2="560" y2="192" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Cognito -->
  <rect x="560" y="320" width="380" height="100" rx="12" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
  <text x="750" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Amazon Cognito</text>
  <text x="750" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">User Pool + Identity Pool</text>
<text x="750" y="386" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">JWT Authorization</text>
  <line x1="440" y1="320" x2="560" y2="362" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 5 API Lambda Functions (specialized handlers) -->
  <rect x="1050" y="80" width="450" height="100" rx="12" fill="#0e7490" stroke="#0c4a6e" stroke-width="2"/>
  <text x="1275" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Projects API Lambda</text>
  <text x="1275" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">5 routes: list/create/get/delete/sync</text>
  <text x="1275" y="146" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">ai-advisor-projects-api</text>
  <rect x="1050" y="200" width="450" height="100" rx="12" fill="#0e7490" stroke="#0c4a6e" stroke-width="2"/>
  <text x="1275" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Resources API Lambda</text>
  <text x="1275" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Read resources by project_id</text>
  <text x="1275" y="266" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">ai-advisor-resources-api</text>
  <rect x="1050" y="320" width="450" height="100" rx="12" fill="#0e7490" stroke="#0c4a6e" stroke-width="2"/>
  <text x="1275" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Insights API Lambda</text>
  <text x="1275" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Bedrock analysis + SNS publish</text>
  <text x="1275" y="386" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">ai-advisor-insights-api</text>
  <rect x="1050" y="440" width="450" height="100" rx="12" fill="#0e7490" stroke="#0c4a6e" stroke-width="2"/>
  <text x="1275" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Chat API Lambda</text>
  <text x="1275" y="490" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Bedrock streaming chat</text>
  <text x="1275" y="506" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">ai-advisor-chat-api</text>
  <rect x="1050" y="560" width="450" height="100" rx="12" fill="#0e7490" stroke="#0c4a6e" stroke-width="2"/>
  <text x="1275" y="600" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Alerts API Lambda</text>
  <text x="1275" y="610" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Read alerts by project_id</text>
  <text x="1275" y="626" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">ai-advisor-alerts-api</text>

  <line x1="750" y1="200" x2="1050" y2="130" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="750" y1="250" x2="1050" y2="250" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="750" y1="300" x2="1050" y2="370" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="750" y1="300" x2="1050" y2="490" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="750" y1="300" x2="1050" y2="610" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Bedrock -->
  <rect x="560" y="480" width="380" height="110" rx="12" fill="#a21caf" stroke="#701a75" stroke-width="2"/>
  <text x="750" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Amazon Bedrock</text>
  <text x="750" y="535" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Claude 3 Haiku</text>
  <text x="750" y="551" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">anthropic.claude-3-haiku-20240307</text>
  <line x1="1050" y1="480" x2="940" y2="502" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1050" y1="600" x2="940" y2="555" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- DynamoDB -->
  <rect x="1050" y="680" width="450" height="130" rx="12" fill="#065f46" stroke="#064e3b" stroke-width="2"/>
  <text x="1275" y="715" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Amazon DynamoDB</text>
  <text x="1275" y="735" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Multi-Table NoSQL (4 tables + 1 GSI)</text>
  <text x="1275" y="751" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">ai-advisor-projects / resources / insights / alerts</text>
  <text x="1275" y="767" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">GSI: resource_type-index</text>
  <text x="1275" y="783" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">PK: project_id (tenant isolation)</text>
  <line x1="750" y1="530" x2="1050" y2="722" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- EventBridge -->
  <rect x="80" y="460" width="360" height="100" rx="12" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <text x="260" y="500" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Amazon EventBridge</text>
  <text x="260" y="510" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Cron 1 Hour</text>
<text x="260" y="526" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Rule triggers Collector</text>
  <!-- Collector -->
  <rect x="80" y="600" width="360" height="100" rx="12" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <text x="260" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Collector Lambda</text>
  <text x="260" y="650" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">boto3 AWS API calls</text>
<text x="260" y="666" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Build insights JSON</text>

  <line x1="260" y1="560" x2="260" y2="592" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="440" y1="620" x2="1050" y2="522" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- SNS -->
  <rect x="560" y="830" width="380" height="100" rx="12" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="750" y="870" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Amazon SNS</text>
  <text x="750" y="880" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Email Alerts</text>
  <text x="750" y="896" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Topic fan-out</text>
  <line x1="440" y1="660" x2="560" y2="852" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Customer Account -->
  <rect x="1050" y="830" width="450" height="130" rx="12" fill="#374151" stroke="#111827" stroke-width="2"/>
  <text x="1275" y="880" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Customer AWS Account</text>
  <text x="1275" y="897" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">Cross-Account IAM Role</text>
  <text x="1275" y="913" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">sts:AssumeRole</text>
  <text x="1275" y="929" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e0e7ff">EC2, S3, IAM, CloudWatch</text>
  <line x1="440" y1="660" x2="1050" y2="877" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="940" y1="660" x2="1050" y2="888" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Bottom notes -->
  <text x="800" y="1030" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">
    AI AWS Advisor: 6 Lambda (5 API + 1 Collector) + DynamoDB Multi-Table (4 tables + 1 GSI) + Cross-Account STS AssumeRole
  </text>
</svg>